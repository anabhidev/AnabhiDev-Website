# ================================================================
# MFB-HR — Miss Fish Bali HR Career & Recruitment Platform
# Cloudflare Pages / Workers Configuration (wrangler.toml)
# IT Department · Miss Fish Bali · Version 2.0
# ================================================================

name = "missfishbali-talent"
pages_build_output_dir = "."
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# Public Non-Sensitive Environment Variables
[vars]
GEMINI_MODEL = "gemini-1.5-flash"
TIMEZONE = "Asia/Makassar"
CLICKUP_API_BASE = "https://api.clickup.com/api/v2"
BRAND_NAME = "Miss Fish Bali"

# ================================================================
# ENCRYPTED SECRETS (Zero Hardcoded Secrets)
# Jangan tuliskan secret token di sini! Masukkan via:
# 1. Cloudflare Dashboard: Pages > Settings > Environment variables
# 2. Atau via Terminal:
#    npx wrangler pages secret put GEMINI_API_KEY
#    npx wrangler pages secret put CLICKUP_API_TOKEN
#    npx wrangler pages secret put CLICKUP_RECRUITMENT_LIST_ID
# ================================================================
