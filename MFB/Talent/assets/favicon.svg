<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Miss Fish Bali">
  <title>Miss Fish Bali</title>
  <!-- Mark ikan Miss Fish. Warna diambil dari aset resmi:
       latar hitam brand #0A0A0A, garis rose gold #E0B060.
       Versi vektor ini dipakai browser modern; PNG di favicon.ico
       menjadi cadangan untuk browser lama. -->
  <rect width="64" height="64" rx="14" fill="#0A0A0A"/>
  <g fill="none" stroke="#E0B060" stroke-linecap="round" stroke-linejoin="round">
    <!-- Badan: lengkung S khas mark Miss Fish -->
    <path d="M27 10 C 36 21, 36 30, 29 40 C 23 48, 24 52, 28 56" stroke-width="5.4"/>
    <!-- Garis sirip mengikuti lengkung badan -->
    <path d="M32 14 C 39 23, 39 31, 33 40 C 28 47, 29 51, 32 55" stroke-width="1.5" opacity=".85"/>
    <path d="M23 15 C 31 23, 31 31, 25 40 C 20 47, 21 51, 24 55" stroke-width="1.5" opacity=".85"/>
  </g>
  <!-- Mata -->
  <circle cx="38" cy="20" r="2.6" fill="#E0B060"/>
</svg>
